name: Apply hand limit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hand-limit-fix.yml'
      - 'scripts/apply-hand-limit-fix.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: node scripts/apply-hand-limit-fix.mjs

      - name: Commit patched GameBoard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- GameBoard.tsx; then
            echo "No GameBoard changes were necessary."
            exit 0
          fi
          git add GameBoard.tsx
          git commit -m "fix: interactive hand limit discard"
          git push
